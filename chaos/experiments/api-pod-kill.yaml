apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: foundry-api-pod-kill
  namespace: foundry
spec:
  schedule: "*/10 * * * *"
  type: PodChaos
  historyLimit: 5
  concurrencyPolicy: Forbid
  podChaos:
    action: pod-kill
    mode: one
    selector:
      namespaces: [foundry]
      labelSelectors:
        app: foundry-api
