apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: foundry-spot
spec:
  weight: 50
  template:
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: foundry
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
  limits:
    cpu: "100"
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: foundry-ondemand
spec:
  weight: 10
  template:
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: foundry
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30m
  limits:
    cpu: "100"
