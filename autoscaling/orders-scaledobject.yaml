apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: foundry-orders
  namespace: foundry
spec:
  scaleTargetRef:
    name: foundry-orders
  minReplicaCount: 0
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 60
  fallback:
    failureThreshold: 3
    replicas: 1
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 120
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
  triggers:
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: "nats.foundry.svc:8222"
        account: "$G"
        stream: ORDERS
        consumer: orders-worker
        lagThreshold: "10"
